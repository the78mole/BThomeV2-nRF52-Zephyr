# XIAO nRF52840 Sense — board-specific config for 200_bthome_imu

# ── LFCLK: RC-Oszillator ─────────────────────────────────────────────────────
# XIAO nRF52840 hat keinen externen 32.768-kHz-Quarz → RC-Oszillator ist Pflicht.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# ── Serial / USB / Log: ausschalten für Batteriebetrieb ──────────────────────────
#
# Das Board-Defconfig (xiao_ble_defconfig) aktiviert USB + UART + CONSOLE.
# Alle drei halten den HFCLK und müssen deaktiviert werden:
#
#   USB_DEVICE_STACK=y  → ~1.1 mA  (USB-SOF-IRQ alle 1 ms hält HFXO)
#   SERIAL=y            → ~1.0 mA  (UARTE0 hält den HFINT-Oszillator)
#
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_CDC_ACM=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

# ── MPSL / HFCLK – wichtiger Hinweis ───────────────────────────────────────────
# CONFIG_BT_UNINIT_MPSL_ON_DISABLE wird hier NICHT gesetzt!
#
# Dieses Sample nutzt System ON / CPU asleep (WFI), KEIN System OFF.
# BT_UNINIT_MPSL_ON_DISABLE ruft mpsl_lib_uninit() auf, was den MPSL-Clock-
# Arbiter entfernt. Wenn danach die Zephyr-RC-Kalibrierung (~alle 4 s) feuert,
# gibt es keinen Arbiter mehr → HFCLK bleibt dauerhaft aktiv → ~400 µA Floor.
#
# Ohne BT_UNINIT_MPSL_ON_DISABLE: bt_disable() gibt HFCLK frei, MPSL bleibt
# initialisiert und verwaltet die RC-Kalibrierung korrekt.
# Ergebnis: CPU im WFI-Sleep → ~10–45 µA.

# ── NFCT-Pins als GPIO freigeben ─────────────────────────────────────────────
CONFIG_NFCT_PINS_AS_GPIOS=y

# ── GPIO-Regulator für IMU-Stromversorgung (P1.08) ───────────────────────────
CONFIG_REGULATOR=y

# ── BLE TX-Leistung begrenzen ─────────────────────────────────────────────────
# −20 dBm genügt für Heimanwendungen (≈10 m), spart ~1.5 mA vs. 0 dBm.
CONFIG_BT_CTLR_TX_PWR_MINUS_20=y
