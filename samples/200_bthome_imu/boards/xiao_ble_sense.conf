# XIAO nRF52840 Sense — board-specific config for 200_bthome_imu

# ── LFCLK: RC-Oszillator (kein Quarz auf Serienhardware bestückt) ────────────
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# ── USB-Serial-Konsole für Entwicklung ───────────────────────────────────────
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# ── NFCT-Pins als GPIO freigeben ─────────────────────────────────────────────
CONFIG_NFCT_PINS_AS_GPIOS=y

# ── GPIO-Regulator für IMU-Stromversorgung (P1.08) ───────────────────────────
CONFIG_REGULATOR=y
