# ── Bluetooth ──────────────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="MAKE-IMU"

# ── BThome V2 library ───────────────────────────────────────────────────────
CONFIG_BTHOME_V2=y

# ── Sensor framework ────────────────────────────────────────────────────────
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_LSM6DSL=y
CONFIG_LSM6DSL_ACCEL_ODR=4
CONFIG_LSM6DSL_GYRO_ODR=4

# ── Logging ─────────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# ── Stack ────────────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=2048

# ── Power Management ─────────────────────────────────────────────────────────
CONFIG_PM_DEVICE=y
CONFIG_TICKLESS_KERNEL=y
