# ── Bluetooth ──────────────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="MAKE-IMU"
# bt_disable() wird im Low-Power-Loop genutzt (kein CTRL_DISABLE-Flag nötig)

# ── BThome V2 library ───────────────────────────────────────────────────────
CONFIG_BTHOME_V2=y

# ── Sensor framework ────────────────────────────────────────────────────────
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_LSM6DSL=y
CONFIG_LSM6DSL_ACCEL_ODR=4
CONFIG_LSM6DSL_GYRO_ODR=4

# ── Logging ─────────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# ── Stack ────────────────────────────────────────────────────────────────────
# bt_enable()/bt_disable() im Loop braucht etwas mehr Stack als einmalige Init
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_BT_RX_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=512

# ── Power Management ─────────────────────────────────────────────────────────
# PM_DEVICE: für IMU SUSPEND/RESUME via pm_device_action_run()
CONFIG_PM_DEVICE=y
# KEIN PM_DEVICE_RUNTIME: würde Work-Queue-Threads erzeugen → Stack-Overhead
CONFIG_PM_DEVICE_RUNTIME=n
# Tickless Kernel: nRF52840 schläft in WFE während k_sleep() → ~3 µA SoC
CONFIG_TICKLESS_KERNEL=y
