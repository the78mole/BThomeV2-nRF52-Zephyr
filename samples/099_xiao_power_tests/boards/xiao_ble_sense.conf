# Seeed XIAO nRF52840 Sense — power baseline
#
# ── Mandatory on XIAO: no external 32.768 kHz crystal ──────────────────────
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# ── Disable everything that holds HFCLK ─────────────────────────────────────
# USB_DEVICE_STACK : ~1.1 mA   (SOF IRQ every 1 ms, keeps HFXO alive)
# SERIAL/UARTE0    : ~1.0 mA   (UARTE0 keeps HFINT running once initialised)
# CONSOLE/LOG      : pulls in serial backends
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_CDC_ACM=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

# ── Disable sensor drivers pulled in by board defconfig ─────────────────────
# Board defconfig enables LSM6DSL on i2c0; we disabled i2c0 in the overlay,
# so the driver fails to find its bus.  Disable it explicitly.
CONFIG_SENSOR=n
CONFIG_LSM6DSL=n

# ── NFCT off (frees P0.09/P0.10, saves ~600 µA) ────────────────────────────
# Without this, the nRF52840 NFCT peripheral is active by default (UICR.NFCPINS
# = NFC).  It draws ~600 µA continuously even when no NFC field is present.
# Setting CONFIG_NFCT_PINS_AS_GPIOS=y patches UICR on first boot.
# IMPORTANT: After flashing the first time, perform a full power cycle
# (unplug USB AND battery) for the UICR write to take effect.
CONFIG_NFCT_PINS_AS_GPIOS=y
