# ── Minimal baseline: NO BT, NO sensors, NO logging ────────────────────────
# Goal: lowest possible idle current on XIAO nRF52840 (Sense).
#
# The application calls k_sleep(K_FOREVER); the kernel idle thread then
# enters WFI.  TICKLESS_KERNEL stops SysTick during sleep.
CONFIG_GPIO=y
CONFIG_TICKLESS_KERNEL=y
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=512
