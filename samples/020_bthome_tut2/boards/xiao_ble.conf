# Seeed XIAO nRF52840 (plain) — board-specific config for bthome_tut2 (PM)
#
# The XIAO nRF52840 has NO external 32.768 kHz crystal.
# Use the internal RC oscillator (LFRC) for BLE — mandatory!
# With RC source the default accuracy is already 500 PPM (no extra config needed).
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Plain XIAO has no IMU — use xiao_ble_sense for the Sense variant.

# ── Power saving (same logic as xiao_ble_sense.conf) ─────────────────────────
CONFIG_USB_DEVICE_STACK=n
# NOTE: Kconfig will emit a harmless warning about USB_CDC_ACM_LOG_LEVEL_OFF
# being an orphaned choice symbol.  This is a known issue in the xiao_ble
# board defconfig (upstream): it sets USB_CDC_ACM_LOG_LEVEL_OFF=y, but when
# USB_DEVICE_STACK=n the USB_CDC_ACM choice group is gone.  There is no way
# to suppress this from an overlay .conf — a board-defconfig patch is needed.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

# ── BLE deep-sleep: MPSL must be uninitialized on bt_disable() ───────────────
# Without this flag, bt_disable() calls sdc_disable() but leaves MPSL running.
# MPSL holds a HFCLK request via the clock-control driver → 16 MHz HFINT stays
# on → ~600 µA base current even with the CPU in WFI.
# With this flag, bt_disable() also calls mpsl_lib_uninit(), which releases
# every HFCLK request and allows the nRF52840 to reach System ON idle (~5 µA).
#
# BT_UNINIT_MPSL_ON_DISABLE depends on MPSL_DYNAMIC_INTERRUPTS, which in turn
# depends on DYNAMIC_DIRECT_INTERRUPTS → DYNAMIC_INTERRUPTS.  ALL four options
# are required; Kconfig silently ignores BT_UNINIT_MPSL_ON_DISABLE if any
# dependency in the chain is missing.
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_DYNAMIC_DIRECT_INTERRUPTS=y
CONFIG_MPSL_DYNAMIC_INTERRUPTS=y
CONFIG_BT_UNINIT_MPSL_ON_DISABLE=y

# ── LFRC calibration: must be disabled when using BT_UNINIT_MPSL_ON_DISABLE ──
# Zephyr's LFRC calibration (nrf_clock_calibration.c) fires a k_timer every
# CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_PERIOD ms.  With CALIBRATION_MAX_SKIP>0
# it compiles USE_TEMP_SENSOR=1, meaning the calibration callback reads
# temperature via mpsl_temperature_get().  After mpsl_lib_uninit(), that call
# blocks indefinitely → hf_release() is never called → HFCLK stays on at
# 630 µA permanently.  A second timer fire adds another +500 µA.
# MPSL manages its own LFRC calibration internally during BLE active phases;
# the Zephyr-level calibration is redundant and dangerous in this configuration.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=n
