# Seeed XIAO nRF52840 Sense — board-specific config for bthome_tut2 (PM)
#
# The XIAO nRF52840 has NO external 32.768 kHz crystal.
# Use the internal RC oscillator (LFRC) for BLE — mandatory!
# With RC source the default accuracy is already 500 PPM (no extra config needed).
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# IMU: LSM6DS3TR-C on the Sense variant (LSM6DSL-compatible driver)
CONFIG_LSM6DSL=y

# ── Power saving ─────────────────────────────────────────────────────────────
#
# Board defconfig (xiao_ble_defconfig) enables USB + UART + CONSOLE by default.
# All three must be explicitly overridden to reach µA-range idle current.
#
# Current breakdown (measured with PPK2):
#   USB_DEVICE_STACK=y  → ~1.1 mA  (USB SOF IRQ every 1 ms, keeps HFXO alive)
#   SERIAL=y            → ~1.0 mA  (UARTE0 keeps 16 MHz HFINT oscillator running)
#   Both off + WFI      → ~5–15 µA (System ON / CPU asleep, BLE LFRC polling)

# Disable USB (was default-on, prevents deep sleep)
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_CDC_ACM=n
# NOTE: Kconfig emits a harmless warning about USB_CDC_ACM_LOG_LEVEL_OFF (see
# boards/xiao_ble.conf for explanation).  Not fixable without a board patch.

# !! MAIN FIX !!
# Disable UART driver — this is the dominant ~1 mA drain.
# UARTE0 keeps the 16 MHz HFINT oscillator running at all times once initialized,
# even when no data is being transferred.  Setting SERIAL=n prevents the nrfx
# UARTE driver from being compiled and the peripheral from being initialized.
CONFIG_SERIAL=n

# With neither USB nor UART there is no physical output path.
# Disable all console / log output to match.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

# ── BLE deep-sleep: MPSL must be uninitialized on bt_disable() ───────────────
# See xiao_ble.conf for full explanation and dependency chain.
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_DYNAMIC_DIRECT_INTERRUPTS=y
CONFIG_MPSL_DYNAMIC_INTERRUPTS=y
CONFIG_BT_UNINIT_MPSL_ON_DISABLE=y

# ── LFRC calibration: must be disabled — see xiao_ble.conf for explanation ───
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=n
