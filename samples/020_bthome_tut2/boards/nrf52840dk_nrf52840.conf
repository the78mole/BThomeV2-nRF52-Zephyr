# nRF52840-DK board-specific config for bthome_full_node
# IMU: MPU-6050 breakout connected via Arduino-I2C header (SDA=P0.26, SCL=P0.27)
CONFIG_MPU6050=y

# ── Power saving ──────────────────────────────────────────────────────────────
# SERIAL/UARTE0 holds a 16 MHz HFINT request as soon as the driver initialises.
# Same applies to CONSOLE and LOG output — all disabled for sleep measurements.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

# ── BLE deep-sleep: full MPSL uninit dependency chain ────────────────────────
# See boards/xiao_ble.conf for explanation.
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_DYNAMIC_DIRECT_INTERRUPTS=y
CONFIG_MPSL_DYNAMIC_INTERRUPTS=y
CONFIG_BT_UNINIT_MPSL_ON_DISABLE=y
