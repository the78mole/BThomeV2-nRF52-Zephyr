# ── Bluetooth ──────────────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="MAKE-020"

# ── BThome V2 library ───────────────────────────────────────────────────────
CONFIG_BTHOME_V2=y

# ── Sensor framework ────────────────────────────────────────────────────────
CONFIG_SENSOR=y
CONFIG_I2C=y

# ── nRF52 internal die-temperature sensor ───────────────────────────────────
CONFIG_TEMP_NRF5=y

# ── IMU: select ONE depending on hardware (see board-specific .conf files) ──
# CONFIG_MPU6050=y     # nRF52840-DK + MPU-6050 breakout
# CONFIG_LSM6DSL=y     # Seeed XIAO nRF52840 Sense (LSM6DS3 = LSM6DSL-compatible)

# ── GPIO ────────────────────────────────────────────────────────────────────
CONFIG_GPIO=y

# ── Logging ─────────────────────────────────────────────────────────────────
# Enabled for development (nRF52840-DK via RTT / UART).
# On XIAO targets this is overridden to CONFIG_LOG=n via boards/xiao_ble*.conf
# to eliminate the deferred-log work queue as a wake-up source.
# LOG_DEFAULT_LEVEL is intentionally not set — Zephyr default is INF (3).
CONFIG_LOG=y

# ── Stack sizes ─────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=1024

# ── Power Management ─────────────────────────────────────────────────────────
# NOTE: CONFIG_PM (System Power Management) is intentionally NOT set here.
# On nRF52, the Zephyr Kconfig chain does not select HAS_PM, so CONFIG_PM=y
# would be silently ignored anyway.  The CPU enters System ON / CPU asleep
# (WFI) via the kernel idle thread — no extra CONFIG_PM hook needed.
#
# What IS useful on nRF52:
#   PM_DEVICE=y          → enables pm_device_action_run() for manual suspend/resume
#   TICKLESS_KERNEL=y    → SysTick stops during sleep (~300 µA saved on DK)
#
# CONFIG_PM_DEVICE_RUNTIME=y is also NOT set: it auto-suspends devices during
# kernel idle, but that mechanism requires CONFIG_PM=y to trigger.  Without it,
# we do explicit suspend/resume in main() around k_sleep() instead.
CONFIG_PM_DEVICE=y
CONFIG_TICKLESS_KERNEL=y
CONFIG_IDLE_STACK_SIZE=512
