# XIAO nRF52840 / Sense — XTAL source (Quarz muss bestückt sein!)
# Ist kein Quarz vorhanden, hängt der Boot (LFCLK startet nicht).
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_20PPM=y

# USB serial console
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# NFCT-Pins als GPIO freigeben (verhindert NFC-Stromaufnahme nach UICR-Patch)
# Hinweis: nach erstem Flash einmaligen Power-Cycle durchführen (USB + Akku trennen)
CONFIG_NFCT_PINS_AS_GPIOS=y
