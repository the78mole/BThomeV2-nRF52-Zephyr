# Seeed XIAO nRF52840 Sense — board-specific config for 100_bthome_pir
#
# The XIAO nRF52840 has NO external 32.768 kHz crystal.
# The internal RC oscillator (LFRC) is mandatory for BLE.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# ── Power saving: Serial / USB / Log ─────────────────────────────────────────
# Board defconfig (xiao_ble_defconfig) enables USB + UART + CONSOLE by default.
# All three hold the 16 MHz HFCLK and must be disabled to reach µA-range idle.
#
#   USB_DEVICE_STACK=y  → ~1.1 mA  (USB SOF IRQ every 1 ms, keeps HFXO alive)
#   SERIAL=y            → ~1.0 mA  (UARTE0 keeps HFINT oscillator running)
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_CDC_ACM=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

# ── MPSL / HFCLK Hinweis ──────────────────────────────────────────────────
# CONFIG_BT_UNINIT_MPSL_ON_DISABLE=y wird hier NICHT gesetzt!
#
# Dieses Sample nutzt System ON / CPU asleep (WFI), KEIN System OFF.
# BT_UNINIT_MPSL_ON_DISABLE ruft mpsl_lib_uninit() auf, was den MPSL-Clock-
# Arbiter entfernt.  Wenn danach die Zephyr-RC-Kalibrierung (~alle 4 s) feuert,
# gibt es keinen Arbiter mehr, der HFCLK nach der Kalibrierung wieder freigibt
# → HFCLK bleibt dauerhaft aktiv → ~400 µA Floor ab ca. Sekunde 10.
#
# Ohne BT_UNINIT_MPSL_ON_DISABLE: bt_disable() gibt HFCLK frei, MPSL bleibt
# aber initialisiert und verwaltet die RC-Kalibrierung selbst korrekt.
# Ergebnis: CPU im WFI-Sleep mit LFRC → ~10–15 µA.
#
# BT_UNINIT_MPSL_ON_DISABLE ist nur für System OFF nötig (z. B. Sample 099).
