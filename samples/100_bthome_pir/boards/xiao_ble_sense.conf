# Seeed XIAO nRF52840 Sense — board-specific config for 100_bthome_pir
#
# The XIAO nRF52840 has NO external 32.768 kHz crystal.
# The internal RC oscillator (LFRC) is mandatory for BLE.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# ── Power saving: Serial / USB / Log ─────────────────────────────────────────
# Board defconfig (xiao_ble_defconfig) enables USB + UART + CONSOLE by default.
# All three hold the 16 MHz HFCLK and must be disabled to reach µA-range idle.
#
#   USB_DEVICE_STACK=y  → ~1.1 mA  (USB SOF IRQ every 1 ms, keeps HFXO alive)
#   SERIAL=y            → ~1.0 mA  (UARTE0 keeps HFINT oscillator running)
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_CDC_ACM=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

# ── MPSL teardown chain (required for System OFF to work) ─────────────────
# nrf_power_system_off() writes SYSTEMOFF=1 then loops on __WFE().  MPSL's
# high-priority timer generates DPPI events that wake __WFE() continuously,
# so the chip never actually reaches System OFF (~665 µA floor).
# Fix: call bt_disable() with CONFIG_BT_UNINIT_MPSL_ON_DISABLE=y BEFORE
# sys_poweroff().  This calls mpsl_lib_uninit() which stops the MPSL timer;
# only then does __WFE() stay asleep and the SYSTEMOFF write takes effect.
# The full four-option chain is required — missing any one silently disables
# the feature in Kconfig.
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_DYNAMIC_DIRECT_INTERRUPTS=y
CONFIG_MPSL_DYNAMIC_INTERRUPTS=y
CONFIG_BT_UNINIT_MPSL_ON_DISABLE=y
# NOTE: CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=n is NOT possible with
# MPSL: mpsl_init.c has a static_assert that requires calibration when RC is
# the LFCLK source.  The calibration timer fires every ~4 s and briefly
# requests HFCLK, but this is a minor cost (~3 µA average).
