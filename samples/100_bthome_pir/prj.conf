# ── Bluetooth ──────────────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="MAKE-PIR"

# ── BThome V2 library ───────────────────────────────────────────────────────
CONFIG_BTHOME_V2=y

# ── GPIO ────────────────────────────────────────────────────────────────────
CONFIG_GPIO=y

# ── Logging (enabled by default for development on nRF52840-DK) ─────────────
# Overridden to CONFIG_LOG=n in boards/xiao_ble*.conf to eliminate the UART
# HFCLK drain on XIAO targets.
CONFIG_LOG=y

# ── Power Management ────────────────────────────────────────────────────────
# CONFIG_PM is intentionally NOT set — on nRF52, HAS_PM is never selected, so
# it would be silently ignored. The CPU enters System ON / CPU asleep (WFI)
# via the kernel idle thread automatically.
#
# CONFIG_PM_DEVICE=y  → device PM framework; aligns with 020 (same sleep path)
# CONFIG_TICKLESS_KERNEL=y → SysTick stops during sleep (~300 µA saved on DK)
# CONFIG_EVENTS=y     → k_event_t used for PIR ISR → main-thread signaling
CONFIG_PM_DEVICE=y
CONFIG_TICKLESS_KERNEL=y
CONFIG_EVENTS=y

# ── Stack sizes ──────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=512
