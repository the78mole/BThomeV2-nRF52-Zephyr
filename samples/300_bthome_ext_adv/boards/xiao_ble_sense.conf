# Seeed XIAO nRF52840 Sense — board-specific config for 300_bthome_ext_adv

# ── LFCLK: RC-Oszillator ──────────────────────────────────────────────────────
# XIAO nRF52840 hat keinen externen 32.768-kHz-Quarz → RC-Pflicht.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# ── Serial / USB / Log: ausschalten für Batteriebetrieb ───────────────────────
# USB_DEVICE_STACK=y  → ~1.1 mA  (USB-SOF-IRQ alle 1 ms hält HFXO)
# SERIAL=y            → ~1.0 mA  (UARTE0 hält HFINT-Oszillator)
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_CDC_ACM=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

# ── MPSL / HFCLK – WICHTIG ────────────────────────────────────────────────────
# CONFIG_BT_UNINIT_MPSL_ON_DISABLE wird NICHT gesetzt!
# Dieses Sample nutzt bt_disable()/bt_enable() NICHT – BT bleibt dauerhaft
# an (System ON, CPU asleep). Der nRF52840 schläft im WFI-Modus (~10–45 µA).
# MPSL bleibt initialisiert und verwaltet RC-Kalibrierung korrekt.

# ── NFCT-Pins als GPIO freigeben (P0.09, P0.10) ───────────────────────────────
CONFIG_NFCT_PINS_AS_GPIOS=y

# ── BLE TX-Leistung: -20 dBm für Heimbereich (≈10 m) ─────────────────────────
CONFIG_BT_CTLR_TX_PWR_MINUS_20=y
