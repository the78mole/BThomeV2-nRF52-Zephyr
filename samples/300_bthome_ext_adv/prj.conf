# ── Bluetooth ──────────────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="MAKE-300"

# ── Extended Advertising ────────────────────────────────────────────────────
# CONFIG_BT_EXT_ADV aktiviert die bt_le_ext_adv_* API.
# Der nRF52840 Controller (CTLR) unterstützt Ext Adv auf HCI-Ebene.
# BT_CTLR und BT_LL_CHOICE_SET sind implizit via NCS-Defaults gesetzt;
# explizite Angabe schadet nicht.
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=1

# ── BThome V2 Library ───────────────────────────────────────────────────────
CONFIG_BTHOME_V2=y

# ── ADC (SAADC für VBAT + VDD) ─────────────────────────────────────────────
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y

# ── GPIO (PIR + VBAT-Spannungsteiler-Enable) ───────────────────────────────
CONFIG_GPIO=y

# ── Power Management ────────────────────────────────────────────────────────
# CONFIG_PM_DEVICE=y  → Device-PM-Framework für ADC suspend/resume
# CONFIG_TICKLESS_KERNEL=y  → SysTick stoppt im Idle → ~300 µA gespart (DK)
CONFIG_PM_DEVICE=y
CONFIG_TICKLESS_KERNEL=y

# ── Stack-Größen ────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
CONFIG_BT_RX_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=512
