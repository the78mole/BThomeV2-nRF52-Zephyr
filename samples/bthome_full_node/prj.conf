# ── Bluetooth ──────────────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="MAKE-BThome"

# ── BThome V2 library ───────────────────────────────────────────────────────
CONFIG_BTHOME_V2=y

# ── Sensor framework ────────────────────────────────────────────────────────
CONFIG_SENSOR=y
CONFIG_I2C=y

# ── nRF52 internal die-temperature sensor ───────────────────────────────────
CONFIG_TEMP_NRF5=y

# ── IMU: select ONE depending on hardware (see board-specific .conf files) ──
# CONFIG_MPU6050=y     # nRF52840-DK + MPU-6050 breakout
# CONFIG_LSM6DSL=y     # Seeed XIAO nRF52840 Sense (LSM6DS3 = LSM6DSL-compatible)

# ── GPIO ────────────────────────────────────────────────────────────────────
CONFIG_GPIO=y

# ── Logging ─────────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# ── Stack sizes ─────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=1024
