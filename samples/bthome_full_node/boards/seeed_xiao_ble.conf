# Seeed XIAO nRF52840 board-specific config for bthome_full_node
#
# The XIAO nRF52840 has NO external 32.768 kHz crystal.
# Use the internal RC oscillator (LFRC) for BLE — mandatory!
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_ACCURACY_500=y

# IMU: LSM6DS3 on XIAO Sense is LSM6DSL-compatible
# (only available on the "Sense" variant)
CONFIG_LSM6DSL=y
