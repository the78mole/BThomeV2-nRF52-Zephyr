[project]
name = "bthomev2-nrf52-tools"
version = "0.1.0"
description = "Power analysis and dev tools for BThomeV2-nRF52-Zephyr"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[project.scripts]
ppk-analysis = "scripts.ppk_analysis:main"

[tool.uv]
managed = true

[tool.uv.sources]
# no external sources needed – all dependencies are stdlib

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
